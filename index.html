<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#131209">
  <title>정품 확인 | NFC Authentication</title>
  <meta name="description" content="포토카드의 NFC 칩 서명을 대조해 정품 여부를 확인합니다.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23131209'/%3E%3Crect x='9' y='6' width='14' height='20' rx='2' fill='none' stroke='%23F7F5EF' stroke-width='2'/%3E%3Crect x='9' y='6' width='14' height='6' fill='%23B3131B'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: Geist;
      src: url(assets/fonts/Geist-Variable.woff2) format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      --bg: #131209; --surface: #181818; --slab: #272727; --edge: #313131;
      --paper: #F7F5EF; --ink: #181818; --soft: #5C5B55; --muted: #A8A69E;
      --line: rgba(247, 245, 239, 0.12);
      --curve: cubic-bezier(0.22, 1, 0.36, 1);
      --accent: var(--edge);
    }
    body[data-kind="genuine"] { --accent: #B3131B; }
    body[data-kind="recheck"] { --accent: #B45309; }
    body[data-kind="rejected"] { --accent: #F4686E; }
    body[data-kind="unavailable"] { --accent: var(--soft); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: Geist, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      background: var(--bg); color: var(--paper);
      min-height: 100vh; min-height: 100dvh;
      display: flex; justify-content: center; padding: 16px;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all; overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }
    h1 { text-wrap: balance; }
    p { text-wrap: pretty; }

    main { width: 100%; max-width: 420px; min-height: calc(100dvh - 32px); display: flex; flex-direction: column; gap: 8px; }
    .brand { padding: 4px 0 8px; text-align: center; color: var(--muted); font-size: 0.75rem; line-height: 1rem; font-weight: 500; }

    .slab { flex: 1; display: flex; padding: 8px; position: relative; overflow: hidden; background: var(--slab); border: 1px solid var(--edge); border-radius: 16px; }
    .slab::after { content: ""; position: absolute; top: 0; bottom: 0; left: -12%; width: 60%; background: rgba(255, 255, 255, 0.05); clip-path: polygon(40% 0, 100% 0, 60% 100%, 0 100%); pointer-events: none; }

    .label { flex: 1; min-height: 196px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding: 16px; background: var(--paper); color: var(--ink); border: 2px solid var(--accent); border-radius: 8px; }
    .pattern { position: absolute; right: -112px; top: -64px; width: 320px; height: 320px; opacity: 0.3; }
    .status { position: relative; display: flex; align-items: center; gap: 8px; margin-bottom: auto; color: var(--accent); font-size: 0.75rem; line-height: 1rem; font-weight: 600; }
    .badge { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--paper); }
    .badge svg { width: 18px; height: 18px; }
    h1 { position: relative; font-size: 1.875rem; line-height: 2.25rem; font-weight: 600; }
    body[data-kind="genuine"] h1 { font-size: 3rem; line-height: 1; color: var(--accent); }
    .detail { position: relative; color: var(--soft); font-size: 0.875rem; line-height: 1.25rem; }

    body[data-kind="rejected"] .label { background: var(--ink); color: var(--paper); }
    body[data-kind="rejected"] .detail { color: var(--muted); }
    body[data-kind="rejected"] .badge { color: var(--ink); }

    body:not([data-kind]) .label { background: var(--surface); border-color: var(--edge); animation: pulse 1400ms var(--curve) infinite alternate; }
    @keyframes pulse { from { opacity: 0.45; } to { opacity: 1; } }

    .record { padding: 4px 16px; background: var(--surface); border: 1px solid var(--edge); border-radius: 16px; }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; font-size: 0.875rem; line-height: 1.25rem; }
    .row + .row { border-top: 1px solid var(--line); }
    .row dt { flex: none; color: var(--muted); }
    .row dd { text-align: right; font-weight: 500; min-width: 0; }

    .code { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 16px; background: var(--paper); color: var(--ink); border-radius: 16px; }
    .bar { display: block; width: 100%; height: 40px; }
    .code span { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem; line-height: 1rem; font-weight: 500; }

    .rise { animation: rise 700ms var(--curve) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, body:not([data-kind]) .label { animation: none; }
    }
  </style>
</head>
<body>
  <main aria-busy="true">
    <p class="brand">NFC Authentication</p>
    <div class="slab">
      <div class="label">
        <svg class="pattern" id="pattern" aria-hidden="true"></svg>
        <div class="status" id="status" hidden>
          <span class="badge"><svg id="mark" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></span>
          <span id="grade"></span>
        </div>
        <h1 id="title" aria-live="polite"></h1>
        <p class="detail" id="detail"></p>
      </div>
    </div>
    <dl class="record" id="record" hidden></dl>
    <div class="code" id="code" hidden>
      <svg class="bar" id="barcode" role="img" aria-label="인증 번호 바코드"></svg>
      <span id="certNumber"></span>
    </div>
  </main>

  <script src="assets/jsbarcode.code128.min.js"></script>
  <script>
    const IS_STANDALONE = location.hostname.includes('github.io') || location.protocol === 'file:';
    const API_BASE = IS_STANDALONE ? 'https://jklfqmbaubvnbrbuhzak.supabase.co/functions/v1' : '';

    const VIEWS = {
      genuine: {
        grade: 'AUTHENTIC', title: '정품입니다', detail: '등록된 정품 포토카드입니다.', color: '#B3131B',
        mark: '<path d="M12 29l11 11 21-23"/>',
      },
      recheck: {
        grade: 'RECHECK', title: '다시 탭해 주세요', detail: '이미 사용된 링크입니다. 카드를 직접 탭하면 다시 확인할 수 있습니다.', color: '#B45309',
        next: '카드 다시 탭', mark: '<path d="M28 12v20M28 44v.5"/>',
      },
      rejected: {
        grade: 'NOT VERIFIED', title: '정품으로 확인되지 않았습니다', detail: '등록된 정품 정보로 확인되지 않습니다. 구매처에 문의해 주세요.', color: '#F4686E',
        next: '구매처 문의', mark: '<path d="M14 14l28 28M42 14L14 42"/>',
      },
      unavailable: {
        grade: 'NO RESULT', title: '확인할 수 없습니다', detail: '연결 상태를 확인한 뒤 카드를 다시 탭해 주세요.', color: '#5C5B55',
        next: '카드 다시 탭', mark: '<path d="M28 12v20M28 44v.5"/>',
      },
    };

    const KIND_BY_RESULT = {
      COUNTER_REPLAY: 'recheck',
      INVALID_MAC: 'rejected',
      INVALID_OTP: 'rejected',
      TAG_NOT_FOUND: 'rejected',
      TAG_INACTIVE: 'rejected',
    };

    const $ = (id) => document.getElementById(id);

    function apiUrl() {
      const search = location.search;
      const params = new URLSearchParams(search);
      const raw = search.replace(/^\?/, '').trim();
      let tlv = /^DF61/i.test(raw) ? raw : (params.get('data') || params.get('tlv') || '').trim();
      if (!tlv) {
        for (const [key, value] of params.entries()) {
          if (key.toUpperCase().startsWith('DF61')) { tlv = key; break; }
          if (value.toUpperCase().startsWith('DF61')) { tlv = value; break; }
        }
      }
      if (tlv) return `${API_BASE}/auth?${tlv}`;

      const uid = params.get('uid');
      const cnt = params.get('cnt') || params.get('ctr');
      const mac = params.get('mac') || params.get('c');
      if (!uid || !cnt || !mac) return null;
      const kid = (params.get('kid') || params.get('kno') || '1').trim();
      const q = new URLSearchParams({
        uid: uid.trim().toUpperCase(), cnt: cnt.trim().toUpperCase(), mac: mac.trim().toUpperCase(), kid,
      });
      return `${API_BASE}/nfc?${q}`;
    }

    async function getVerdict() {
      const url = apiUrl();
      if (!url) return { kind: 'unavailable' };
      try {
        const data = await (await fetch(url)).json();
        const success = data.success === true && data.resultCode === 'SUCCESS';
        const kind = success ? 'genuine' : (KIND_BY_RESULT[data.resultCode] ?? 'unavailable');
        return { kind, data };
      } catch (err) {
        console.error('인증 서버 통신 오류:', err);
        return { kind: 'unavailable' };
      }
    }

    function certNumber(data) {
      const uid = (data.uid || '').toUpperCase().replace(/[^0-9A-F]/g, '');
      if (!uid) return null;
      const issued = data.firstVerifiedAt ? new Date(data.firstVerifiedAt) : new Date();
      return `CERT-${issued.getFullYear()}-${uid.slice(-8)}`;
    }

    function recordRows(kind, data) {
      const p = (data && data.productInfo) || {};
      const album = [p.year, p.album].filter(Boolean).join(' ');
      const now = new Date().toLocaleString('ko-KR', { dateStyle: 'long', timeStyle: 'short' });
      const product = kind === 'genuine' || kind === 'recheck';
      return [
        ...(product ? [
          p.artist ? ['아티스트', p.artist] : ['브랜드', p.brand],
          p.member ? ['멤버', p.member] : ['모델', p.model || data.tagName],
          ['앨범', album],
        ] : []),
        ...(kind === 'genuine' ? [
          ['카드 번호', p.cardNumber && `#${p.cardNumber}`],
          ['발행처', p.issuer],
          ['시리얼', p.serialNumber],
        ] : []),
        ...(VIEWS[kind].next ? [['다음 단계', VIEWS[kind].next]] : []),
        ['확인 시각', now],
      ].filter(([, value]) => value);
    }

    function renderRecord(rows) {
      rows.forEach(([label, value]) => {
        const row = document.createElement('div');
        row.className = 'row';
        const dt = document.createElement('dt');
        dt.textContent = label;
        const dd = document.createElement('dd');
        dd.textContent = value;
        row.append(dt, dd);
        $('record').append(row);
      });
      $('record').hidden = false;
    }

    function renderBarcode(value) {
      if (!value) return;
      $('certNumber').textContent = value;
      $('code').hidden = false;
      if (typeof JsBarcode !== 'function') return $('barcode').remove();
      const svg = $('barcode');
      JsBarcode(svg, value, { format: 'CODE128', displayValue: false, height: 40, margin: 0, width: 1, background: 'transparent', lineColor: 'currentColor' });
      svg.removeAttribute('style');
      svg.setAttribute('preserveAspectRatio', 'none');
    }

    function drawRosette(svg, color) {
      const size = 400;
      const center = size / 2;
      const loops = 24;
      const petals = 7;
      svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
      for (let k = 0; k < loops; k += 1) {
        const rotation = (k / loops) * Math.PI * 2;
        const points = [];
        for (let i = 0; i <= 360; i += 2) {
          const t = (i / 360) * Math.PI * 2;
          const radius = size * 0.48 * (0.5 + 0.5 * Math.cos(petals * t));
          points.push(`${(center + radius * Math.cos(t + rotation)).toFixed(1)} ${(center + radius * Math.sin(t + rotation)).toFixed(1)}`);
        }
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M${points.join('L')}Z`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', '0.7');
        svg.append(path);
      }
    }

    function render({ kind, data }) {
      const view = VIEWS[kind];
      document.body.dataset.kind = kind;
      document.title = `${view.title} | NFC Authentication`;
      document.querySelector('main').removeAttribute('aria-busy');
      drawRosette($('pattern'), view.color);
      $('mark').innerHTML = view.mark;
      $('grade').textContent = view.grade;
      $('status').hidden = false;
      $('title').textContent = view.title;
      $('title').classList.add('rise');
      $('detail').textContent = view.detail;
      renderRecord(recordRows(kind, data));
      if (kind === 'genuine') renderBarcode(certNumber(data));
    }

    getVerdict().then(render);
  </script>
</body>
</html>
