<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NFC 정품 보안 인증 시스템 - Orca Auth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 440px;
    }
    .card {
      background: #1e293b;
      border-radius: 28px;
      padding: 36px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .card-strip {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: #64748b;
      transition: background 0.3s ease;
    }
    .icon-wrapper {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .icon {
      width: 48px;
      height: 48px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .info-box {
      background: #0f172a;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: left;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      color: #64748b;
      font-weight: 500;
    }
    .info-value {
      color: #f1f5f9;
      font-weight: 600;
      text-align: right;
      word-break: break-all;
    }
    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
    }
    .action-btn {
      display: block;
      width: 100%;
      background: #3b82f6;
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      padding: 15px;
      border-radius: 16px;
      text-decoration: none;
      transition: transform 0.1s, opacity 0.2s;
      border: none;
      cursor: pointer;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
    .tech-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 11px;
      color: #475569;
    }
    /* 로딩 애니메이션 */
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .test-box {
      margin-top: 20px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
    }
    .test-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 12px;
      background: #334155;
      color: #38bdf8;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="mainCard">
      <div class="card-strip" id="cardStrip"></div>

      <!-- 아이콘 영역 -->
      <div class="icon-wrapper" id="iconWrapper">
        <div class="spinner" id="spinner"></div>
      </div>

      <!-- 제목 및 설명 -->
      <h1 id="title">보안 칩 인증 중...</h1>
      <p class="subtitle" id="subtitle">NTAG 424 DNA 보안 서명을 실시간 검증하고 있습니다.</p>

      <!-- 상세 정보 박스 -->
      <div class="info-box" id="infoBox" style="display: none;"></div>

      <!-- 액션 버튼 -->
      <a href="#" class="action-btn" id="actionBtn" style="display: none;">고객센터 문의</a>

      <!-- 테스트 샘플 버튼 (파라미터 누락 시에만 표시) -->
      <div class="test-box" id="testBox" style="display: none;">
        <p><strong>💡 파라미터가 없는 상태입니다.</strong><br>아래 테스트 버튼을 눌러 정품 인증 동작을 바로 확인해보세요:</p>
        <a href="?uid=04de5f1eacc040&cnt=000000500000&mac=07DF733A03723D48" class="test-btn">정품 인증 테스트 실행하기</a>
      </div>

      <!-- 푸터 -->
      <div class="footer">
        <p>NXP NTAG 424 DNA Secure Dynamic Messaging</p>
        <div class="tech-badge">
          <span>🔒 AES-128 CMAC & Envelope Encryption</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 배포된 Supabase 실서버 엔드포인트
    const SUPABASE_API_URL = 'https://jklfqmbaubvnbrbuhzak.supabase.co/functions/v1/nfc';

    async function verifyTag() {
      const urlParams = new URLSearchParams(window.location.search);
      const uid = urlParams.get('uid');
      const cnt = urlParams.get('cnt') || urlParams.get('ctr');
      const mac = urlParams.get('mac') || urlParams.get('c');
      const kid = urlParams.get('kid') || urlParams.get('kno') || '1';

      const titleEl = document.getElementById('title');
      const subtitleEl = document.getElementById('subtitle');
      const iconWrapperEl = document.getElementById('iconWrapper');
      const cardStripEl = document.getElementById('cardStrip');
      const infoBoxEl = document.getElementById('infoBox');
      const actionBtnEl = document.getElementById('actionBtn');
      const testBoxEl = document.getElementById('testBox');

      // 파라미터 누락 처리
      if (!uid || !cnt || !mac) {
        titleEl.textContent = 'NFC 인증 파라미터 필요';
        subtitleEl.textContent = '스마트폰으로 NTAG 424 DNA 태그를 탭하거나 올바른 인증 URL로 접속해주세요.';
        cardStripEl.style.background = '#64748b';
        iconWrapperEl.innerHTML = `
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        `;
        testBoxEl.style.display = 'block';
        return;
      }

      try {
        // Supabase Edge Function 실시간 호출
        const apiUrl = `${SUPABASE_API_URL}?uid=${encodeURIComponent(uid)}&cnt=${encodeURIComponent(cnt)}&mac=${encodeURIComponent(mac)}&kid=${encodeURIComponent(kid)}&format=json`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        // 1. 정품 인증 성공 (SUCCESS)
        if (data.success && data.resultCode === 'SUCCESS') {
          const green = '#10b981';
          cardStripEl.style.background = green;
          iconWrapperEl.style.background = 'rgba(16, 185, 129, 0.15)';
          iconWrapperEl.style.borderColor = 'rgba(16, 185, 129, 0.4)';
          iconWrapperEl.innerHTML = `
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="${green}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          `;
          titleEl.textContent = '정품 인증 완료';
          subtitleEl.textContent = 'NXP NTAG 424 DNA 암호화 검증을 통과한 공식 정품입니다.';

          const pInfo = data.productInfo || {};
          const firstDate = data.firstVerifiedAt ? new Date(data.firstVerifiedAt).toLocaleString('ko-KR') : '방금 전';

          infoBoxEl.innerHTML = `
            <div class="info-row">
              <span class="info-label">브랜드</span>
              <span class="info-value">${pInfo.brand || 'Orca Authentication'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">제품명</span>
              <span class="info-value">${pInfo.model || data.tagName || '정품 인증 상품'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">정품 시리얼</span>
              <span class="info-value">${pInfo.serialNumber || ('SN-' + data.uid.slice(-8).toUpperCase())}</span>
            </div>
            <div class="info-row">
              <span class="info-label">태그 UID</span>
              <span class="info-value" style="font-family: monospace;">${data.uid.toUpperCase()}</span>
            </div>
            <div class="info-row">
              <span class="info-label">보안 카운터</span>
              <span class="info-value"><span class="pill" style="background: rgba(16, 185, 129, 0.2); color: ${green};">#${data.counter}</span></span>
            </div>
            <div class="info-row">
              <span class="info-label">총 인증 횟수</span>
              <span class="info-value">${data.totalScans}회 인증됨</span>
            </div>
            <div class="info-row">
              <span class="info-label">최초 인증 일시</span>
              <span class="info-value">${firstDate}</span>
            </div>
          `;
          infoBoxEl.style.display = 'block';

          actionBtnEl.style.background = green;
          actionBtnEl.style.color = '#0f172a';
          actionBtnEl.textContent = '제품 상세 및 보증서 확인';
          actionBtnEl.href = pInfo.supportUrl || '#';
          actionBtnEl.style.display = 'block';

        // 2. 복제 의심 경고 (COUNTER_REPLAY)
        } else if (data.resultCode === 'COUNTER_REPLAY') {
          const amber = '#f59e0b';
          cardStripEl.style.background = amber;
          iconWrapperEl.style.background = 'rgba(245, 158, 11, 0.15)';
          iconWrapperEl.style.borderColor = 'rgba(245, 158, 11, 0.4)';
          iconWrapperEl.innerHTML = `
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="${amber}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          `;
          titleEl.textContent = '복제 의심 경고 (재전송 감지)';
          subtitleEl.textContent = '이전에 이미 사용된 보안 카운터입니다. 브라우저 새로고침이 아니라면 불법 복제된 태그일 수 있습니다.';

          infoBoxEl.innerHTML = `
            <div class="info-row">
              <span class="info-label">태그 UID</span>
              <span class="info-value" style="font-family: monospace;">${(data.uid || uid).toUpperCase()}</span>
            </div>
            <div class="info-row">
              <span class="info-label">감지된 카운터</span>
              <span class="info-value"><span class="pill" style="background: rgba(245, 158, 11, 0.2); color: ${amber};">#${data.counter || cnt}</span></span>
            </div>
            <div class="info-row">
              <span class="info-label">상태</span>
              <span class="info-value" style="color: ${amber};">이미 검증된 태깅 값</span>
            </div>
          `;
          infoBoxEl.style.display = 'block';

          actionBtnEl.style.background = amber;
          actionBtnEl.style.color = '#0f172a';
          actionBtnEl.textContent = '고객센터에 복제 신고하기';
          actionBtnEl.href = '#';
          actionBtnEl.style.display = 'block';

        // 3. 위조 의심 경고 (INVALID_MAC)
        } else if (data.resultCode === 'INVALID_MAC') {
          const red = '#ef4444';
          cardStripEl.style.background = red;
          iconWrapperEl.style.background = 'rgba(239, 68, 68, 0.15)';
          iconWrapperEl.style.borderColor = 'rgba(239, 68, 68, 0.4)';
          iconWrapperEl.innerHTML = `
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="${red}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
          `;
          titleEl.textContent = '위조품 의심 경고';
          subtitleEl.textContent = 'NFC 보안 암호화 서명(CMAC)이 일치하지 않습니다. 위조품이거나 훼손된 태그입니다.';

          infoBoxEl.innerHTML = `
            <div class="info-row">
              <span class="info-label">검증 결과</span>
              <span class="info-value" style="color: ${red};">암호 서명 불일치</span>
            </div>
            <div class="info-row">
              <span class="info-label">태그 UID</span>
              <span class="info-value" style="font-family: monospace;">${(data.uid || uid).toUpperCase()}</span>
            </div>
          `;
          infoBoxEl.style.display = 'block';

          actionBtnEl.style.background = red;
          actionBtnEl.style.color = '#ffffff';
          actionBtnEl.textContent = '위조품 신고 및 고객센터';
          actionBtnEl.href = '#';
          actionBtnEl.style.display = 'block';

        // 4. 기타 에러
        } else {
          titleEl.textContent = '인증 실패';
          subtitleEl.textContent = data.message || '인증 정보를 확인할 수 없습니다.';
          cardStripEl.style.background = '#64748b';
        }

      } catch (err) {
        console.error('검증 통신 오류:', err);
        titleEl.textContent = '서버 통신 오류';
        subtitleEl.textContent = '인증 서버와 연결할 수 없습니다. 잠시 후 다시 시도해주세요.';
      }
    }

    // 페이지 로드 시 검증 실행
    verifyTag();
  </script>
</body>
</html>
