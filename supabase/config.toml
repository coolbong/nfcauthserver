# Supabase Project Configuration
project_id = "nfcauthserver"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[functions.nfc]
# v1 SDM NFC 태그 검증 엔드포인트
verify_jwt = false

[functions.auth]
# 단일 파라미터 BER-TLV (DF61, DF62, DF63) + RFC 4226 HOTP 인증 엔드포인트
verify_jwt = false

[functions.admin]
# 카드 관리자 API. 관리자 JWT가 필요하다.
verify_jwt = true
