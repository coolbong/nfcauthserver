# Supabase Project Configuration
project_id = "nfcauthserver"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[functions.nfc]
# v1 SDM NFC 태그 검증 엔드포인트
verify_jwt = false

[functions.auth]
# v2 TLV (DF61, DF62, DF63) + HOTP 인증 엔드포인트
verify_jwt = false

[functions.v2]
# v2 라우팅 (/v2/auth, /v2) 엔드포인트
verify_jwt = false
