<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC 카운터 초기화 허브 | NFC Authentication</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      text-align: center;
      padding: 12px 0;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: #334155;
      color: #38bdf8;
      font-size: 13px;
      padding: 10px;
    }
    .btn-secondary:hover { background: #475569; }
    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .tag-item {
      padding: 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .tag-info {
      flex: 1;
      min-width: 0;
    }
    .tag-title {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tag-uid {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
    }
    .tag-stat {
      text-align: right;
      flex-shrink: 0;
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
    }
    .pill-green { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .pill-amber { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .test-links {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔄 NFC 카운터 관리자 패널</h1>
      <p>스마트카드 보안 카운터를 실시간 확인하고 원클릭으로 0번 초기화합니다.</p>
    </div>

    <!-- 성공 / 오류 안내 메시지 -->
    <div class="alert alert-success" id="alertSuccess">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span id="alertSuccessMsg">카운터가 0으로 성공적으로 초기화되었습니다!</span>
    </div>
    <div class="alert alert-error" id="alertError">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span id="alertErrorMsg">초기화 중 오류가 발생했습니다.</span>
    </div>

    <!-- 실행 카드 -->
    <div class="card">
      <button class="btn btn-primary" id="btnResetAll" onclick="handleResetAll()">
        <span id="btnIcon">🔄</span>
        <span id="btnText">전체 태그 카운터 0으로 즉시 초기화</span>
      </button>

      <div style="margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase;">등록된 스마트카드 태그 상태</span>
          <button onclick="loadStatus()" style="background: none; border: none; color: #38bdf8; font-size: 11px; cursor: pointer; text-decoration: underline;">새로고침</button>
        </div>
        <div id="tagList">
          <p style="font-size: 12px; color: var(--muted); text-align: center; padding: 20px 0;">상태 불러오는 중...</p>
        </div>
      </div>
    </div>

    <!-- 초기화 후 바로 테스트할 수 있는 링크 -->
    <div class="card" id="testBox">
      <span style="font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase;">초기화 후 바로 검증하기 (카운터 #0)</span>
      <div class="test-links">
        <a href="/?DF61100102030405060708090A0B0C0D0E0F10DF6203328482DF6303000000" class="btn btn-secondary">
          ▶ 20B 키 카드 카운터 #0 정품 인증 테스트
        </a>
        <a href="/?DF61100102030405060708090A0B0C0D0E0F16DF6203328482DF6303000000" class="btn btn-secondary" style="background: #1e3a8a; color: #93c5fd;">
          ▶ 16B 키 카드 카운터 #0 정품 인증 테스트
        </a>
        <a href="/" class="btn btn-secondary" style="background: transparent; border: 1px solid var(--border); color: var(--muted);">
          ← 정품 확인 메인 페이지로 이동
        </a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    async function loadStatus() {
      try {
        const res = await fetch(`${API_BASE}/auth?action=status`);
        const data = await res.json();
        renderTags(data.tags || []);
      } catch (err) {
        console.error('상태 로드 실패:', err);
      }
    }

    function renderTags(tags) {
      const container = document.getElementById('tagList');
      if (!tags.length) {
        container.innerHTML = '<p style="font-size: 12px; color: var(--muted); text-align: center; padding: 12px 0;">등록된 태그가 없습니다.</p>';
        return;
      }
      container.innerHTML = tags.map(t => {
        const isFresh = (t.last_counter === 0 && t.total_scans === 0);
        const pillClass = isFresh ? 'pill-green' : 'pill-amber';
        const statusText = isFresh ? '#0 (대기중)' : `#${t.last_counter} (${t.total_scans}회 사용)`;
        return `
          <div class="tag-item">
            <div class="tag-info">
              <div class="tag-title">${t.tag_name || 'NFC 스마트카드'}</div>
              <div class="tag-uid">UID: ${t.uid}</div>
            </div>
            <div class="tag-stat">
              <span class="pill ${pillClass}">${statusText}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleResetAll() {
      const btn = document.getElementById('btnResetAll');
      const btnIcon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');
      const alertSuccess = document.getElementById('alertSuccess');
      const alertError = document.getElementById('alertError');

      btn.disabled = true;
      btnIcon.innerHTML = '<div class="spinner"></div>';
      btnText.textContent = '카운터 초기화 중...';
      alertSuccess.style.display = 'none';
      alertError.style.display = 'none';

      try {
        const res = await fetch(`${API_BASE}/auth?action=reset`);
        const data = await res.json();

        if (data.success) {
          alertSuccess.style.display = 'flex';
          document.getElementById('alertSuccessMsg').textContent = data.message || '카운터가 0으로 초기화되었습니다!';
          renderTags(data.tags || []);
        } else {
          alertError.style.display = 'flex';
          document.getElementById('alertErrorMsg').textContent = data.message || '초기화 실패';
        }
      } catch (err) {
        alertError.style.display = 'flex';
        document.getElementById('alertErrorMsg').textContent = '서버 통신 오류가 발생했습니다.';
      } finally {
        btn.disabled = false;
        btnIcon.textContent = '🔄';
        btnText.textContent = '전체 태그 카운터 0으로 즉시 초기화';
      }
    }

    // 초기 상태 불러오기
    loadStatus();
  </script>
</body>
</html>
